name: Build Android APK Definitivo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Java 11 (Obrigatório para o Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Instalar Dependências do Sistema Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-safe-cflags \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            pkg-config \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Instalar Cython e Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      - name: Aceitar Licenças do Android SDK Automaticamente
        run: |
          mkdir -p ~/.android
          echo "### License accepted by Android SDK Build Tool" > ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true

      - name: Executar Compilação Buildozer
        run: |
          buildozer -v android debug

      - name: Guardar APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: bin/*.apk
