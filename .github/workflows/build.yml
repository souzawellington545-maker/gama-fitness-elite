name: Build Android APK Definitivo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java 11 (Obrigatório para o Android SDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Instalar Dependências do Sistema Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libffi-dev \
          libssl-dev \
          automake \
          autoconf \
          libtool \
          unzip \
          zip \
          rsync \
          libltdl-dev

    - name: Instalar Cython e Buildozer
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36
        pip install git+https://github.com/kivy/buildozer.git

    - name: Executar Compilação Buildozer
      run: |
        buildozer -v android debug

    - name: Guardar APK Gerado
      uses: actions/upload-artifact@v4
      with:
        name: gama-fitness-elite-apk
        path: bin/*.apk
